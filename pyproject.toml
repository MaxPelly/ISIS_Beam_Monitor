[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-monitor"
dynamic = ["version"]
description = "ISIS Facility Beam and MCR News Monitor"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.14,<4",
    "websockets>=16,<18",
]

[project.scripts]
isis-monitor = "isis_monitor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
# Not deploy/ or the push_site submodule, which is a separate project.
include = ["isis_monitor*"]

[tool.setuptools.dynamic]
version = {attr = "isis_monitor.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep the push_site submodule's tests (and dependencies) out of this run.
testpaths = ["isis_monitor/tests"]

[tool.ruff]
extend-exclude = ["push_site"]  # a separate project, with its own checks

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]
ignore = ["B027"]  # Notifier's hooks are no-ops unless a subclass needs them
