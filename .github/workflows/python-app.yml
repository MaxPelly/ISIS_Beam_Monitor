# Lints and tests every push and pull request to the main branch, on each
# supported Python.

name: Python application

on:
  push:
    branches: [ "AI_assisted_main" ]
  pull_request:
    branches: [ "AI_assisted_main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Lint
      run: ruff check .
    - name: Test
      # The gate sits a little under the measured coverage (99%), so it catches
      # a real drop without failing on a small one.
      run: pytest --cov=isis_monitor --cov-branch --cov-report=term-missing --cov-fail-under=97
