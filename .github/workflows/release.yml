# Publishes a GitHub release when a vX.Y.Z tag is pushed, with its notes
# taken from that version's CHANGELOG.md section. Only the last job, which
# runs no project code, can write to the repository.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"
    - name: Check the tag matches the version
      run: |
        version=$(python -c "import isis_monitor; print(isis_monitor.__version__)")
        test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
    - name: Test
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
        pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
        grep -q . notes.md || { echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
        # A release candidate (or alpha/beta) is a pre-release, so it isn't shown as the latest.
        prerelease=$(echo "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc)[0-9]+$' && echo --prerelease || true)
        gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
