# Publishes a GitHub release when a vX.Y.Z tag is pushed, with its notes
# taken from that version's CHANGELOG.md section.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"
    - name: Check the tag matches the version
      run: |
        version=$(python -c "import isis_monitor; print(isis_monitor.__version__)")
        test "$GITHUB_REF_NAME" = "v$version" || { echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
    - name: Test
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pytest
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        awk -v v="[${GITHUB_REF_NAME#v}]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
        grep -q . notes.md || { echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
        gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
