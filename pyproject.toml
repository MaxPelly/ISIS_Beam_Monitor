[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-monitor"
version = "0.1.0"
description = "ISIS Facility Beam and MCR News Monitor"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "websockets>=12,<14",
    "rich>=13,<14",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
