[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-monitor"
dynamic = ["version"]
description = "ISIS Facility Beam and MCR News Monitor"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.14,<4",
    "websockets>=16,<18",
]

[project.scripts]
isis-monitor = "isis_monitor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
# Not deploy/.
include = ["isis_monitor*"]
exclude = ["isis_monitor.tests*"]

[tool.setuptools.dynamic]
version = {attr = "isis_monitor.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["isis_monitor/tests"]

[tool.coverage.run]
omit = ["isis_monitor/tests/*"]  # the gate measures the monitor, not its tests

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]
ignore = ["B027"]  # Notifier's hooks are no-ops unless a subclass needs them
